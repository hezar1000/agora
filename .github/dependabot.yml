version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: agora
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: agora
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
