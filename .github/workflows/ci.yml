name: Agora CI

on:
  push:
    branches: [agora]
  pull_request:
    branches: [agora]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      DJANGO_ALLOW_INSECURE_LOCAL_DEFAULTS: "1"
      SAML2_INTEGRATION_ENABLED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_new.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements_new.txt
      - name: Validate installed dependency graph
        run: python -m pip check
      - name: Run Django checks
        run: python manage.py check
      - name: Ensure model changes have migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run all unit tests
        run: python manage.py test --verbosity 2
      - name: Check latency-first audio under sustained stalls
        if: matrix.python-version == '3.12'
        run: node tests/classroom_microphone_worklets.cjs

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_new.txt
      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Audit resolved production dependencies
        run: python -m pip_audit --requirement requirements_new.txt

  postgres:
    name: PostgreSQL 14 compatibility (production engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: agora_test
          POSTGRES_USER: agora
          POSTGRES_PASSWORD: agora_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agora -d agora_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://agora:agora_test_password@127.0.0.1:5432/agora_test
      DJANGO_ALLOW_INSECURE_LOCAL_DEFAULTS: "1"
      SAML2_INTEGRATION_ENABLED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_new.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements_new.txt
      - name: Validate installed dependency graph
        run: python -m pip check
      # 14 is what agora.students.cs.ubc.ca runs. Testing a newer major
      # would give no signal about the one this actually deploys onto.
      - name: Validate and migrate a fresh PostgreSQL database
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run all unit tests on PostgreSQL
        run: python manage.py test --verbosity 2

