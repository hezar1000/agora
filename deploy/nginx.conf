# Install as /etc/nginx/sites-available/agora.conf and enable it from
# /etc/nginx/sites-enabled. This file is included inside nginx's http block.
# Replace agora.example.edu with your hostname throughout. See
# docs/DEPLOYING.md.

# Never log query strings. SAML HTTP-Redirect messages put signed protocol
# payloads in the query, so `$request` and `$request_uri` are intentionally not
# present. Correlate edge and application events with the generated request ID.
log_format agora_no_query '$remote_addr [$time_local] request_id=$request_id '
                          '"$request_method $uri $server_protocol" $status '
                          '$body_bytes_sent request_time=$request_time '
                          'upstream_status=$upstream_status '
                          'upstream_time=$upstream_response_time';

upstream agora_asgi {
    least_conn;
    server 127.0.0.1:8090 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8091 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8092 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8093 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name agora.example.edu;
    access_log /var/log/nginx/agora.access.log agora_no_query;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://agora.example.edu$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agora.example.edu;
    charset utf-8;

    access_log /var/log/nginx/agora.access.log agora_no_query;
    error_log /var/log/nginx/agora.error.log;

    ssl_certificate /etc/letsencrypt/live/agora.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agora.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AgoraSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is staged by DJANGO_HSTS_SECONDS. Keep includeSubDomains/preload off
    # until the documented hostname audit and HTTPS validation are complete.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Django applies the compatibility Content-Security-Policy consistently to
    # dynamic responses. Keeping it there avoids divergent duplicate policies.
    add_header X-Request-ID $request_id always;

    client_max_body_size 20M;
    client_body_timeout 30s;

    location /static/ {
        alias /home/agora/agora-data/staticfiles/;
        access_log off;
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /ws/ {
        proxy_pass http://agora_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx is the only trusted application proxy; overwrite any
        # client-supplied forwarding chain instead of preserving spoofed IPs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    location / {
        proxy_pass http://agora_asgi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # No /media/ alias: uploads (profile photos) are served by Django, which
    # checks who is asking.

    location ~ /\. {
        deny all;
    }
}
