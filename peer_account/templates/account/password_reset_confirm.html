{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"><title>Choose a new password</title>
  <link rel="stylesheet" href="/static/dist/components/site.css">
  <link rel="stylesheet" href="/static/dist/components/container.css">
  <link rel="stylesheet" href="/static/dist/components/grid.css">
  <link rel="stylesheet" href="/static/dist/components/segment.css">
  <link rel="stylesheet" href="/static/dist/components/form.css">
  <link rel="stylesheet" href="/static/dist/components/button.css">
  <style>body{background:#002145} .column{max-width:450px}</style>
</head>
<body>
<div class="ui middle aligned center aligned grid" style="height:100vh">
  <div class="column">
    <div class="ui stacked segment">
      <h2 class="ui header">Set a new password</h2>
      {% if validlink %}
        <form method="post" class="ui form">{% csrf_token %}
          <div class="field">
            <label>New password</label>
            <input aria-label="New password" type="password" name="new_password1" required>
          </div>
          <div class="field">
            <label>Confirm new password</label>
            <input aria-label="Confirm new password" type="password" name="new_password2" required>
          </div>
          <button class="ui fluid blue button" type="submit">Update password</button>
        </form>
      {% else %}
        <div class="ui red message">This link is invalid or has expired. Please request a new one.</div>
        <a class="ui basic button" href="{% url 'account:password_reset' %}">Request another link</a>
      {% endif %}
    </div>
  </div>
</div>
</body>
</html>
