{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reset your password</title>
  <link rel="stylesheet" href="/static/dist/components/reset.css">
  <link rel="stylesheet" href="/static/dist/components/site.css">
  <link rel="stylesheet" href="/static/dist/components/container.css">
  <link rel="stylesheet" href="/static/dist/components/grid.css">
  <link rel="stylesheet" href="/static/dist/components/segment.css">
  <link rel="stylesheet" href="/static/dist/components/form.css">
  <link rel="stylesheet" href="/static/dist/components/button.css">
  <style>body{background:#002145} .column{max-width:450px}</style>
</head>
<body>
<div class="ui middle aligned center aligned grid" style="height:100vh">
  <div class="column">
    <div class="ui stacked segment">
      <h2 class="ui header">Forgot your password?</h2>
      <p>Enter the email associated with your account. We’ll email a reset link (valid for 15 minutes).</p>
      <p style="color:rgba(0,0,0,.6)">If you normally sign in through CWL, your account has no password
        to reset — use the CWL login instead.</p>
      <form method="post" class="ui form">{% csrf_token %}
        <div class="field">
          <label style="color:rgba(0,0,0,.6)">Email</label>
          <input aria-label="you@example.com" type="email" name="email" required placeholder="you@example.com">
        </div>
        <button class="ui fluid blue button" type="submit">Send reset link</button>
      </form>
    </div>
    <a class="ui basic button" href="{% url 'account:login' %}">Back to login</a>
  </div>
</div>
</body>
</html>
