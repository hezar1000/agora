<!-- BLUE block -->
<div id="color-block-blue">
    <button class="btn btn-primary btn-ms" id="next_student_blue" disabled="disabled">
        <span class="glyphicon glyphicon-user"></span>
        Next student
    </button>
    <button class="btn btn-primary btn-ms" id="clear_all_blue" disabled="disabled">
        <span class="glyphicon glyphicon-erase"></span>
        Clear
    </button>
    <button class="btn btn-primary btn-ms" id="enable_blue">
        Enable Blue
    </button>
    <span class="glyphicon glyphicon-pencil rename-icon clickable-icon-bg" onclick="renameColor('blue')" style="cursor: pointer;"></span>
    <span id="hide_blue" class="glyphicon glyphicon-filter clickable-icon-bg" style="cursor: pointer; margin-left: 5px;" onclick="toggleHideList('blue')"></span>

</div>
