<!-- RED block -->
<div id="color-block-red">
    <button class="btn btn-danger btn-ms" id="next_student_red" disabled="disabled">
        <span class="glyphicon glyphicon-user"></span>
        Next student
    </button>
    <button class="btn btn-danger btn-ms" id="clear_all_red" disabled="disabled">
        <span class="glyphicon glyphicon-erase"></span>
        Clear
    </button>
    <button class="btn btn-danger btn-ms" id="enable_red">
        Enable Red
    </button>
    <span class="glyphicon glyphicon-pencil rename-icon clickable-icon-bg" onclick="renameColor('red')" style="cursor: pointer;"></span>

    <span id="hide_red" class="glyphicon glyphicon-filter clickable-icon-bg" style="cursor: pointer; margin-left: 5px;" onclick="toggleHideList('red')"></span>
</div>
