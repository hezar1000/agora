<div id="color-block-yellow">
    <button class="btn btn-warning btn-ms" id="next_student_yellow" disabled="disabled">
        <span class="glyphicon glyphicon-user"></span>
        Next student
    </button>
    <button class="btn btn-warning btn-ms" id="clear_all_yellow" disabled="disabled">
        <span class="glyphicon glyphicon-erase"></span>
        Clear
    </button>
    <button class="btn btn-warning btn-ms" id="enable_yellow">
        Enable Yellow
    </button>
    <span class="glyphicon glyphicon-pencil rename-icon clickable-icon-bg" onclick="renameColor('yellow')" style="cursor: pointer;"></span>

    <span id="hide_yellow" class="glyphicon glyphicon-filter clickable-icon-bg" style="cursor: pointer; margin-left: 5px;" onclick="toggleHideList('yellow')"></span>
</div>
