<div class="container">
  <form method="post">
    {% csrf_token %}

    <!-- auto‑filled title -->
    <fieldset class="form-group">
      <legend>Title</legend>
      <input aria-label="Poll title"
        type="text"
        id="quick-poll-title"
        name="poll-title"
        class="form-control"
        readonly
      >
    </fieldset>

    <!-- single‑line prompt -->
    <fieldset class="form-group">
      <legend>Prompt</legend>
      <input aria-label="Answer the prompt."
        type="text"
        name="poll-data"
        class="form-control"
        placeholder="Answer the prompt."
        required
      >
    </fieldset>

    <!-- mode chooser -->
    <fieldset class="form-group">
      <legend>Poll Mode</legend>
      <div class="btn-group" data-toggle="buttons">
        <label class="btn btn-default active">
          <input type="radio" name="pollMode" value="iclicker" autocomplete="off" checked> iClicker
        </label>
        <label class="btn btn-default">
          <input aria-label="Pollmode" type="radio" name="pollMode" value="standard" autocomplete="off"> Likert
        </label>
        <label class="btn btn-default">
          <input aria-label="Pollmode" type="radio" name="pollMode" value="numerical" autocomplete="off"> Numerical
        </label>
        <label class="btn btn-default">
          <input aria-label="Pollmode" type="radio" name="pollMode" value="list" autocomplete="off"> Participation
        </label>
      </div>
    </fieldset>

    <button type="submit" class="btn btn-primary" name="start-poll">
      Start Poll
    </button>
  </form>
</div>

<script>
  // on load, fill in the title with "quick_poll + timestamp"
  document.addEventListener('DOMContentLoaded', function() {
    const now = new Date();
    const ts = now.toLocaleString('en-CA', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    document.getElementById('quick-poll-title').value = `quick_poll ${ts}`;
  });
</script>
